<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PasteRoom</title>
<meta name="description" content="Paste text or code, get a 6-character code, share it.">
<script>
  try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'light'; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link id="hljs-theme" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<style>
:root{
  --bg:#fff; --side:#f6f8fa; --line:#d1d9e0; --text:#1f2328; --muted:#59636e; --gutter:#818b98;
  --hover:#eaeef2; --accent:#0969da; --ink:#fff; --status:#0969da; --ok:#1a7f37;
  --sans:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --nav:56px;
}
[data-theme=dark]{
  --bg:#0d1117; --side:#151b23; --line:#30363d; --text:#e6edf3; --muted:#8d96a0; --gutter:#6e7681;
  --hover:#212830; --accent:#1f6feb; --ink:#fff; --status:#1f6feb; --ok:#3fb950;
}
*{box-sizing:border-box}
html{color-scheme:light}
[data-theme=dark]{color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);-webkit-text-size-adjust:100%;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
[hidden]{display:none!important}

/* ---- shell: phone first ---- */
.app{display:grid;height:100dvh;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top" "main" "nav"}
.top{grid-area:top;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:env(safe-area-inset-top) 14px 0;height:calc(48px + env(safe-area-inset-top));background:var(--side);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;letter-spacing:-.01em}
.logo svg{width:18px;height:18px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hint{display:none;margin-left:auto;color:var(--muted);font:12px var(--mono)}
.icon{width:32px;height:32px;display:grid;place-items:center;background:none;border:1px solid var(--line);border-radius:6px;color:var(--muted);cursor:pointer}
.icon:hover{background:var(--hover);color:var(--text)}
.icon svg,.bnav svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[data-theme=dark] .moon,[data-theme=light] .sun{display:none}

.side{grid-area:main;display:none;overflow:auto;background:var(--side);padding:18px 16px}
.main{grid-area:main;display:flex;flex-direction:column;min-width:0;min-height:0}
.status{display:none}
.bnav{grid-area:nav;display:flex;background:var(--side);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bnav button{flex:1;height:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:0;color:var(--muted);font-size:12px;cursor:pointer}
.bnav button[aria-current=true]{color:var(--accent);font-weight:600}
body[data-view=open] .side,body[data-view=recent] .side{display:block}
body[data-view=open] .main,body[data-view=recent] .main{display:none}
body[data-view=open] .sec-recent,body[data-view=recent] .sec-open{display:none}
body[data-show=viewer] #editor,body:not([data-show=viewer]) #viewer{display:none}

/* ---- sidebar content ---- */
.side h2{margin:0 0 8px;font-size:13px;font-weight:600}
.sec-recent{margin-top:24px}
.row{display:flex;gap:8px}
#codeIn{flex:1;min-width:0;height:44px;padding:0 12px;font:500 18px var(--mono);letter-spacing:.2em;text-transform:uppercase;background:var(--bg);border:1px solid var(--line);border-radius:6px}
#codeIn::placeholder{color:var(--line)}
#codeIn:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.ri{display:flex;align-items:baseline;gap:10px;width:100%;padding:9px 10px;margin:0 0 2px;text-align:left;background:none;border:1px solid transparent;border-radius:6px;cursor:pointer}
.ri:hover{background:var(--hover)}
.ri b{font:500 13px var(--mono);letter-spacing:.08em;color:var(--accent)}
.ri span{color:var(--muted);font:12px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{margin:0;color:var(--muted);font-size:13px}
.note{margin:20px 0 0;color:var(--muted);font-size:13px}

/* ---- tab bar + editor ---- */
.tabbar{display:flex;align-items:stretch;gap:10px;background:var(--side);border-bottom:1px solid var(--line);padding:0 10px 0 0;min-height:42px}
.tab{display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--bg);border-right:1px solid var(--line);border-top:2px solid var(--accent);margin-bottom:-1px;font:13px var(--mono);white-space:nowrap}
.tab i{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.7}
.tab i.saved{background:var(--ok);opacity:1}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto}
select{background:var(--bg);border:1px solid var(--line);border-radius:6px;height:30px;padding:0 8px;font-size:13px;max-width:140px}
.btn{height:32px;padding:0 14px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--ink);font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.55;cursor:wait}
.btn.ghost{background:var(--bg);color:var(--text);border-color:var(--line)}
.btn.ghost:hover{background:var(--hover);filter:none}
.pane{flex:1;display:flex;flex-direction:column;min-height:0}
.edwrap{flex:1;display:flex;min-height:0;background:var(--bg)}
.gut{flex:none;min-width:46px;padding:14px 10px 30px 12px;text-align:right;color:var(--gutter);font:13px/20px var(--mono);overflow:hidden;white-space:pre;user-select:none;border-right:1px solid var(--line)}
#text{flex:1;min-width:0;resize:none;border:0;border-radius:0;background:var(--bg);padding:14px 16px 30px;font:13px/20px var(--mono);white-space:pre;overflow:auto;tab-size:2}
#text:focus{outline:none}

/* ---- viewer ---- */
.vbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.vcode{font:500 24px/1 var(--mono);letter-spacing:.22em;color:var(--accent)}
.vmeta{color:var(--muted);font:12px var(--mono)}
.vacts{display:flex;gap:8px;margin-left:auto}
.vcode-wrap{flex:1;min-height:0;overflow:auto;display:flex;background:var(--bg)}
.vgut{position:sticky;left:0;flex:none;padding:14px 10px 14px 12px;text-align:right;color:var(--gutter);background:var(--bg);border-right:1px solid var(--line);font:13px/20px var(--mono);white-space:pre;user-select:none}
.vcode-wrap pre{margin:0;flex:1 0 auto}
.vcode-wrap pre code.hljs{display:block;overflow:visible;min-width:max-content;padding:14px 16px;background:transparent;font:13px/20px var(--mono)}

#toast{position:fixed;left:50%;bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:6px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:9;max-width:92vw}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---- phone specifics ---- */
@media (max-width:899px){
  .gut{display:none}
  #text{font-size:16px;line-height:24px;white-space:pre-wrap;padding:14px 14px 96px}
  select,#codeIn{font-size:16px}
  select{height:34px}
  #saveBtn{position:fixed;right:14px;bottom:calc(var(--nav) + 14px + env(safe-area-inset-bottom));height:46px;padding:0 22px;font-size:15px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:5}
  .tab{padding:0 12px}
  .tools{padding:6px 0}
  .vacts{width:100%;margin-left:0}
  .vacts .btn{flex:1;height:40px}
  .vcode{font-size:22px}
}

/* ---- desktop: an IDE ---- */
@media (min-width:900px){
  .app{grid-template-columns:284px minmax(0,1fr);grid-template-rows:46px minmax(0,1fr) 26px;grid-template-areas:"top top" "side main" "status status"}
  .top{height:46px;padding:0 16px}
  .hint{display:block}
  .side{grid-area:side;display:block!important;border-right:1px solid var(--line)}
  .main{grid-area:main;display:flex!important}
  .sec-open,.sec-recent{display:block!important}
  .bnav{display:none}
  .status{grid-area:status;display:flex;align-items:center;gap:18px;padding:0 14px;background:var(--status);color:#fff;font:12px var(--mono)}
  .status .sp{margin-left:auto}
  .status .sp ~ span{margin-left:0}
  .conn::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#7ee787;margin-right:7px}
  .conn.off::before{background:#ffa198}
  #toast{bottom:44px}
  .tabbar{padding-right:14px}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body data-view="new" data-show="editor">
<div class="app">
  <header class="top">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M8 4h8l4 4v12H8z"/><path d="M4 8v12M12 12h4M12 16h4"/></svg>PasteRoom
    </div>
    <span class="hint">Ctrl+Enter saves</span>
    <button class="icon" id="themeBtn" aria-label="Switch between light and dark theme">
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <aside class="side">
    <div class="sec-open">
      <h2>Open a code</h2>
      <div class="row">
        <input id="codeIn" maxlength="6" placeholder="ABC234" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Paste code">
        <button class="btn" id="openBtn" style="height:44px">Open</button>
      </div>
      <p class="note">Anyone with a code can read that paste. Codes have 6 letters or digits.</p>
    </div>
    <div class="sec-recent">
      <h2>Recent on this device</h2>
      <div id="recent"></div>
    </div>
  </aside>

  <main class="main">
    <section class="pane" id="editor">
      <div class="tabbar">
        <div class="tab"><i id="dot"></i><span id="fname">paste.txt</span></div>
        <div class="tools">
          <select id="lang" aria-label="Language">
            <option value="auto">Auto-detect</option>
            <option value="plaintext">Plain text</option>
            <option value="javascript">JavaScript</option>
            <option value="typescript">TypeScript</option>
            <option value="python">Python</option>
            <option value="java">Java</option>
            <option value="cpp">C++</option>
            <option value="csharp">C#</option>
            <option value="go">Go</option>
            <option value="rust">Rust</option>
            <option value="php">PHP</option>
            <option value="ruby">Ruby</option>
            <option value="kotlin">Kotlin</option>
            <option value="swift">Swift</option>
            <option value="xml">HTML / XML</option>
            <option value="css">CSS</option>
            <option value="json">JSON</option>
            <option value="yaml">YAML</option>
            <option value="sql">SQL</option>
            <option value="bash">Bash</option>
            <option value="markdown">Markdown</option>
          </select>
          <button class="btn" id="saveBtn">Save paste</button>
        </div>
      </div>
      <div class="edwrap">
        <div class="gut" id="gut" aria-hidden="true">1</div>
        <textarea id="text" wrap="off" placeholder="Paste your text or code here" spellcheck="false" maxlength="100000" aria-label="Paste content"></textarea>
      </div>
    </section>

    <section class="pane" id="viewer">
      <div class="vbar">
        <span class="vcode" id="codeLabel"></span>
        <span class="vmeta" id="meta"></span>
        <div class="vacts">
          <button class="btn" id="copyText">Copy text</button>
          <button class="btn ghost" id="copyCode">Copy code</button>
          <button class="btn ghost" id="newBtn">New</button>
        </div>
      </div>
      <div class="vcode-wrap"><div class="vgut" id="vgut" aria-hidden="true"></div><pre><code id="out" class="hljs"></code></pre></div>
    </section>
  </main>

  <footer class="status">
    <span class="conn" id="conn">connecting</span>
    <span id="stPos">Ln 1, Col 1</span>
    <span class="sp" id="stLang">Plain text</span>
    <span id="stChars">0 / 100,000</span>
    <span id="stCode">no code</span>
  </footer>

  <nav class="bnav" aria-label="Sections">
    <button id="nNew" aria-current="true"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New</button>
    <button id="nOpen"><svg viewBox="0 0 24 24"><path d="M4 9h16M4 15h16M10 3L8 21M16 3l-2 18"/></svg>Open</button>
    <button id="nRecent"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Recent</button>
  </nav>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="firebase-config.js"></script>
<script>
const $ = s => document.querySelector(s);
// No 0/O or 1/I so codes are easy to read out loud.
const ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const CODE_RE = /^[A-HJ-NP-Z2-9]{6}$/;
const MAX = 100000;
const EXT = { javascript:'js', typescript:'ts', python:'py', java:'java', cpp:'cpp', csharp:'cs', go:'go', rust:'rs',
  php:'php', ruby:'rb', kotlin:'kt', swift:'swift', xml:'html', css:'css', json:'json', yaml:'yml', sql:'sql',
  bash:'sh', markdown:'md' };
const ext = l => EXT[l] || 'txt';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
let current = '', currentCode = '';

/* ---------- theme ---------- */
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  $('#hljs-theme').href = 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/' +
    (t === 'dark' ? 'github-dark' : 'github') + '.min.css';
  try { localStorage.setItem('theme', t); } catch (e) {}
}
$('#themeBtn').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
setTheme(document.documentElement.dataset.theme);

/* ---------- helpers ---------- */
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
function copy(str, msg) {
  const done = () => toast(msg);
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(str).then(done, () => fallbackCopy(str, done));
  } else fallbackCopy(str, done);
}
function fallbackCopy(str, done) {
  const ta = document.createElement('textarea');
  ta.value = str; ta.style.cssText = 'position:fixed;opacity:0;font-size:16px';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast('Copy failed. Select the text manually.'); }
  ta.remove();
}
// On phones the bottom nav switches views; on desktop the sidebar is always visible.
function setView(v) {
  document.body.dataset.view = v;
  [['nNew','new'],['nOpen','open'],['nRecent','recent']].forEach(([id, n]) =>
    $('#' + id).setAttribute('aria-current', n === v));
  if (v === 'open' && matchMedia('(max-width:899px)').matches) $('#codeIn').focus();
}
$('#nNew').onclick = () => document.body.dataset.show === 'viewer' ? newPaste() : setView('new');
$('#nOpen').onclick = () => setView('open');
$('#nRecent').onclick = () => setView('recent');

/* ---------- connection status ---------- */
db.ref('.info/connected').on('value', s => {
  const c = $('#conn'), on = s.val() === true;
  c.textContent = on ? 'online' : 'offline';
  c.classList.toggle('off', !on);
});

/* ---------- editor: gutter, cursor, status ---------- */
const ta = $('#text');
function langName() { return $('#lang').selectedOptions[0].textContent; }
function refresh() {
  const n = ta.value.split('\n').length;
  $('#gut').textContent = Array.from({ length: n }, (_, i) => i + 1).join('\n');
  $('#stChars').textContent = ta.value.length.toLocaleString() + ' / 100,000';
  $('#dot').className = '';
  $('#fname').textContent = 'paste.' + ext($('#lang').value);
  $('#stLang').textContent = langName();
  cursor();
}
function cursor() {
  const v = ta.value.slice(0, ta.selectionStart);
  $('#stPos').textContent = 'Ln ' + v.split('\n').length + ', Col ' + (v.length - v.lastIndexOf('\n'));
}
ta.addEventListener('input', refresh);
['keyup', 'click'].forEach(e => ta.addEventListener(e, cursor));
ta.addEventListener('scroll', () => { $('#gut').scrollTop = ta.scrollTop; });
$('#lang').addEventListener('change', refresh);
ta.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') createPaste(); });

/* ---------- recent codes (kept on this device only) ---------- */
function getRecent() { try { return JSON.parse(localStorage.getItem('recent') || '[]'); } catch (e) { return []; } }
function addRecent(code, text) {
  const list = getRecent().filter(r => r.c !== code);
  list.unshift({ c: code, p: text.trim().slice(0, 40).replace(/\s+/g, ' ') });
  try { localStorage.setItem('recent', JSON.stringify(list.slice(0, 10))); } catch (e) {}
  renderRecent();
}
function renderRecent() {
  const l = getRecent().filter(r => CODE_RE.test(r.c));
  $('#recent').innerHTML = l.length
    ? l.map(r => '<button class="ri" data-c="' + r.c + '"><b>' + r.c + '</b><span>' + esc(r.p) + '</span></button>').join('')
    : '<p class="empty">Codes you create or open show up here.</p>';
}
$('#recent').onclick = e => { const b = e.target.closest('.ri'); if (b) openPaste(b.dataset.c); };
renderRecent();

/* ---------- show a paste ---------- */
function show(code, text, lang) {
  current = text; currentCode = code;
  const out = $('#out');
  out.className = 'hljs';
  let used = 'Plain text';
  if (lang && lang !== 'plaintext' && text.length <= 60000) {
    try {
      const r = (lang === 'auto' || !hljs.getLanguage(lang))
        ? hljs.highlightAuto(text)
        : hljs.highlight(text, { language: lang, ignoreIllegals: true });
      out.innerHTML = r.value;
      used = r.language ? (hljs.getLanguage(r.language)?.name || r.language) : 'Plain text';
    } catch (e) { out.textContent = text; }
  } else out.textContent = text;
  const lines = text.split('\n').length;
  $('#vgut').textContent = Array.from({ length: lines }, (_, i) => i + 1).join('\n');
  $('#codeLabel').textContent = code;
  $('#meta').textContent = used + ', ' + lines.toLocaleString() + (lines === 1 ? ' line' : ' lines');
  $('#stCode').textContent = 'code ' + code;
  $('#stLang').textContent = used;
  $('#stChars').textContent = text.length.toLocaleString() + ' chars';
  document.body.dataset.show = 'viewer';
  setView('new');
  addRecent(code, text);
  history.replaceState(null, '', '#' + code);
}
$('#copyCode').onclick = () => copy(currentCode, 'Code copied');
$('#copyText').onclick = () => copy(current, 'Text copied');
function newPaste() {
  ta.value = ''; refresh();
  document.body.dataset.show = 'editor';
  $('#stCode').textContent = 'no code';
  history.replaceState(null, '', location.pathname + location.search);
  setView('new'); ta.focus();
}
$('#newBtn').onclick = newPaste;

/* ---------- create ---------- */
function genCode() {
  const a = new Uint32Array(6);
  crypto.getRandomValues(a);
  return Array.from(a, n => ALPHABET[n % ALPHABET.length]).join(''); // 32 chars: no modulo bias
}
async function createPaste() {
  const text = ta.value;
  const lang = $('#lang').value;
  if (!text.trim()) return toast('Paste some text first');
  if (text.length > MAX) return toast('Too long. The limit is 100,000 characters');
  const btn = $('#saveBtn');
  btn.disabled = true; btn.textContent = 'Saving';
  try {
    // A transaction only writes when the code is free, so a used code is never overwritten.
    for (let i = 0; i < 12; i++) {
      const code = genCode();
      const res = await db.ref('pastes/' + code).transaction(
        cur => cur === null
          ? { text, lang, createdAt: firebase.database.ServerValue.TIMESTAMP }
          : undefined,
        undefined, false);
      if (res.committed) { show(code, text, lang); toast('Saved. Your code is ' + code); return; }
    }
    toast('Could not find a free code. Try again');
  } catch (e) {
    console.error(e);
    toast('Save failed. Check your database rules and connection');
  } finally {
    btn.disabled = false; btn.textContent = 'Save paste';
  }
}
$('#saveBtn').onclick = createPaste;

/* ---------- open ---------- */
async function openPaste(raw) {
  const code = String(raw).toUpperCase().replace(/\s/g, '');
  if (!CODE_RE.test(code)) return toast('Codes have 6 letters or digits, like ABC234');
  const btn = $('#openBtn');
  btn.disabled = true;
  try {
    const snap = await db.ref('pastes/' + code).once('value');
    if (!snap.exists()) return toast('No paste found for ' + code);
    const v = snap.val();
    show(code, v.text, v.lang || 'auto');
  } catch (e) {
    console.error(e);
    toast('Could not load. Check your connection');
  } finally { btn.disabled = false; }
}
$('#openBtn').onclick = () => openPaste($('#codeIn').value);
$('#codeIn').addEventListener('keydown', e => { if (e.key === 'Enter') openPaste(e.target.value); });
$('#codeIn').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase(); });

/* ---------- open from link, e.g. yoursite.github.io/#ABC234 ---------- */
refresh();
const h = location.hash.slice(1).toUpperCase();
if (CODE_RE.test(h)) { $('#codeIn').value = h; openPaste(h); }
</script>
